version: '3.8'

services:
  yahoo-calendar-bridge:
    build: .
    container_name: yahoo-calendar-bridge
    ports:
      - "7000:7000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
